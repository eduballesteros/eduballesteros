name: Update activity terminal

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-activity.mjs
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-terminal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate terminal from GitHub statistics
        run: node scripts/update-activity.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save updated image
        run: |
          git add assets/activity-terminal.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update activity terminal'
          git push origin HEAD:main
